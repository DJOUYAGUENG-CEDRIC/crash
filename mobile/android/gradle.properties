org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx512m,-XX:-UseParallelGC
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler crashes trying to relativize paths when the
# project (D:\...) and the Flutter pub cache (C:\Users\...) are on different
# Windows drive letters ("this and base files have different roots").
# Disabling incremental compilation avoids that relativeTo() call entirely.
kotlin.incremental=false
